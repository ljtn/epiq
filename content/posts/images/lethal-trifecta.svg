<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Three overlapping circles: private data, untrusted content and a way out. Only where all three meet is an agent lethal; remove one and the circuit breaks.">
	<style>
		.c1  { fill: rgba(198,167,255,.10); stroke: #c6a7ff; stroke-width: 1.2; }
		.c2  { fill: rgba(103,212,232,.10); stroke: #67d4e8; stroke-width: 1.2; }
		.c3  { fill: rgba(224,163,111,.10); stroke: #e0a36f; stroke-width: 1.2; }
		.lbl { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; dominant-baseline: central; }
		.ax  { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-anchor: middle; dominant-baseline: central; fill: #e9e6f5; }
		.k1  { fill: #c6a7ff; }
		.k2  { fill: #67d4e8; }
		.k3  { fill: #e0a36f; }
	</style>
	<circle class="c1" cx="305" cy="130" r="100" />
	<circle class="c2" cx="415" cy="130" r="100" />
	<circle class="c3" cx="360" cy="220" r="100" />
	<text class="lbl k1" x="252" y="92">Private</text>
	<text class="lbl k1" x="252" y="110">data</text>
	<text class="lbl k2" x="468" y="92">Untrusted</text>
	<text class="lbl k2" x="468" y="110">content</text>
	<text class="lbl k3" x="360" y="272">A way out</text>
	<text class="ax" x="360" y="160">LETHAL</text>
</svg>
