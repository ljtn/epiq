<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="One workflow repo runs through host and sandbox, carried between them by git; the gatekeeper and the agents all work it. The code checkout sits below the agents, and the host reaches it read-only.">
	<style>
		.wall { fill: rgba(198,167,255,.04); stroke: #c6a7ff; stroke-width: 1; }
		.box  { fill: #14131d; stroke: #9aa1b5; stroke-width: 1; }
		.key  { fill: #14131d; stroke: #c6a7ff; stroke-width: 1.2; }
		.epiq { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.fill { fill: rgba(103,212,232,.10); }
		.code { fill: rgba(111,134,163,.12); stroke: #6f86a3; stroke-width: 1; }
		.full { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.rest { fill: none; stroke: #6f86a3; stroke-width: 1; }
		.ro   { stroke-dasharray: 4 4; }
		.ax   { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; fill: #6f86a3; }
		.lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9aa1b5; text-anchor: middle; dominant-baseline: central; }
		.c-f  { fill: #c6a7ff; }
		.c-e  { fill: #67d4e8; }
	</style>
	<defs>
		<marker id="tip-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#67d4e8" />
		</marker>
		<marker id="tip-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#6f86a3" />
		</marker>
	</defs>

	<rect class="wall" x="20" y="20" width="220" height="250" rx="4" />
	<text class="ax" x="36" y="42">HOST</text>
	<rect class="wall" x="300" y="20" width="580" height="250" rx="4" />
	<text class="ax" x="316" y="42">SANDBOX</text>

	<rect class="fill" x="50" y="60" width="190" height="28" />
	<rect class="fill" x="300" y="60" width="550" height="28" />
	<path class="epiq" d="M240 60 H53 Q50 60 50 63 V85 Q50 88 53 88 H240" />
	<path class="epiq ro" d="M240 60 H300 M240 88 H300" />
	<path class="epiq" d="M300 60 H847 Q850 60 850 63 V85 Q850 88 847 88 H300" />
	<text class="lbl c-e" x="450" y="74">Workflow repo</text>

	<path class="full" d="M130 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M389 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M523 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M657 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M791 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<rect class="key" x="50" y="130" width="160" height="36" rx="3" /><text class="lbl c-f" x="130" y="148">Gatekeeper</text>
	<rect class="box" x="330" y="130" width="118" height="36" rx="3" /><text class="lbl" x="389" y="148">Investigator</text>
	<rect class="box" x="464" y="130" width="118" height="36" rx="3" /><text class="lbl" x="523" y="148">Planner</text>
	<rect class="box" x="598" y="130" width="118" height="36" rx="3" /><text class="lbl" x="657" y="148">Implementer</text>
	<rect class="box" x="732" y="130" width="118" height="36" rx="3" /><text class="lbl" x="791" y="148">Reviewer</text>
	<path class="rest" d="M389 166 V210 M523 166 V210 M657 166 V210 M791 166 V210" />
	<rect class="code" x="330" y="210" width="520" height="28" rx="3" /><text class="lbl" x="590" y="224">Code repo</text>

	<path class="rest ro" d="M328 224 H130 V168" marker-end="url(#tip-r)" />

	<path class="full" d="M230 300 H260" /><text class="ax" x="270" y="304">SHARED, READ / WRITE</text>
	<path class="rest" d="M470 300 H500" /><text class="ax" x="510" y="304">SANDBOX ONLY</text>
	<path class="rest ro" d="M650 300 H680" /><text class="ax" x="690" y="304">READ-ONLY</text>
</svg>
