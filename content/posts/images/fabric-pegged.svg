<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 720 240" width="720" height="240" role="img" aria-label="The fabric pegged down at its edges, its slack heaped in the middle with nothing to hold it up.">
	<style>
		.fab  { fill: rgba(198,167,255,.07); stroke: #c6a7ff; stroke-width: 1; stroke-linejoin: round; }
		.heap { fill: url(#heapfill); }
		.rim  { fill: none; stroke: #c6a7ff; stroke-width: 1; stroke-linecap: round; }
		.shade { fill: none; stroke: #000; stroke-width: 7; opacity: .45; filter: url(#soft); transform: translate(0, 2.5px); }
		.tie  { fill: none; stroke: #6f86a3; stroke-width: 1; opacity: .8; }
		.peg  { fill: none; stroke: #9aa1b5; stroke-width: 1.6; stroke-linecap: round; }
		.ld   { fill: none; stroke: rgba(78,84,133,.9); stroke-width: 1; }
		.ax   { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
		.lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9aa1b5; }
		.c-f  { fill: #c6a7ff; }
		.c-g  { fill: #9aa1b5; }
	</style>

