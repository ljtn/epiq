<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="Two trackers. The workflow repo, an internal tracker shared over git, is read and written by the gatekeeper on the host and by the agents in the sandbox; the code repo stays in the sandbox and the host reads it read-only. A public issue tracker for the team and stakeholders sits outside, and only the gatekeeper connects to it.">
	<style>
		.wall { fill: rgba(198,167,255,.04); stroke: #c6a7ff; stroke-width: 1; }
		.box  { fill: #14131d; stroke: #9aa1b5; stroke-width: 1; }
		.key  { fill: #14131d; stroke: #c6a7ff; stroke-width: 1.2; }
		.epiq { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.fill { fill: rgba(103,212,232,.10); }
		.code { fill: rgba(111,134,163,.12); stroke: #6f86a3; stroke-width: 1; }
		.board { fill: rgba(143,227,176,.08); stroke: #8fe3b0; stroke-width: 1.2; }
		.full { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.pub  { fill: none; stroke: #8fe3b0; stroke-width: 1.2; }
		.rest { fill: none; stroke: #6f86a3; stroke-width: 1; }
		.ro   { stroke-dasharray: 4 4; }
		.ax   { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; fill: #6f86a3; }
		.lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9aa1b5; text-anchor: middle; dominant-baseline: central; }
		.c-f  { fill: #c6a7ff; }
		.c-e  { fill: #67d4e8; }
		.c-b  { fill: #8fe3b0; }
	</style>
	<defs>
		<marker id="tip-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#67d4e8" />
		</marker>
		<marker id="tip-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#8fe3b0" />
		</marker>
		<marker id="tip-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#6f86a3" />
		</marker>
	</defs>

	<rect class="board" x="20" y="20" width="860" height="36" rx="4" />
	<text class="ax" x="36" y="42">PUBLIC</text>
	<text class="lbl c-b" x="450" y="38">Public issue tracker</text>
	<text class="ax" x="864" y="42" text-anchor="end">TEAM · STAKEHOLDERS</text>

	<rect class="wall" x="20" y="80" width="220" height="250" rx="4" />
	<text class="ax" x="36" y="102">HOST</text>
	<rect class="wall" x="300" y="80" width="580" height="250" rx="4" />
	<text class="ax" x="316" y="102">SANDBOX</text>

	<rect class="fill" x="50" y="120" width="190" height="28" />
	<rect class="fill" x="300" y="120" width="550" height="28" />
	<path class="epiq" d="M 240 120 H 53 Q 50 120 50 123 V 145 Q 50 148 53 148 H 240" />
	<path class="epiq ro" d="M 240 120 H 300 M 240 148 H 300" />
	<path class="epiq" d="M 300 120 H 847 Q 850 120 850 123 V 145 Q 850 148 847 148 H 300" />
	<text class="lbl c-e" x="450" y="134">Workflow repo · internal tracker</text>

	<path class="full" d="M 130 150 V 188" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M410 150 V188" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M590 150 V188" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M770 150 V188" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<rect class="key" x="50" y="190" width="160" height="36" rx="3" /><text class="lbl c-f" x="130" y="208">Gatekeeper</text>
	<rect class="box" x="330" y="190" width="160" height="36" rx="3" /><text class="lbl" x="410" y="208">Planner</text>
	<rect class="box" x="510" y="190" width="160" height="36" rx="3" /><text class="lbl" x="590" y="208">Implementer</text>
	<rect class="box" x="690" y="190" width="160" height="36" rx="3" /><text class="lbl" x="770" y="208">Reviewer</text>
	<path class="rest" d="M410 226 V270 M590 226 V270 M770 226 V270" />
	<rect class="code" x="330" y="270" width="520" height="28" rx="3" /><text class="lbl" x="590" y="284">Code repo</text>

	<path class="rest ro" d="M328 284 H262 V218 H214" marker-end="url(#tip-r)" />
	<text class="ax" x="130" y="250" text-anchor="middle">HUMAN SUPERVISED</text>

	<path class="pub" d="M28 58 V208 H46" marker-start="url(#tip-b)" marker-end="url(#tip-b)" />

	<path class="full" d="M118 360 H148" /><text class="ax" x="158" y="364">SHARED, READ / WRITE</text>
	<path class="rest" d="M346 360 H376" /><text class="ax" x="386" y="364">SANDBOX ONLY</text>
	<path class="rest ro" d="M518 360 H548" /><text class="ax" x="558" y="364">READ-ONLY</text>
	<path class="pub" d="M668 360 H698" /><text class="ax" x="708" y="364">GATEKEEPER ONLY</text>
</svg>
