<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="A three by three matrix of cognitive complexity against severity. Each cell shows the product of the two, and the score bands say whether agents may run unsupervised.">
	<style>
		.ax   { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #666f91; letter-spacing: .12em; }
		.tick { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9aa1b5; }
		.lg   { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #666f91; letter-spacing: .06em; }
		.n    { font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
		/* Same reading as the layer diagram: cyan is where cost concentrates,
		   violet is where debt is cheap to carry. The bands fall on the
		   diagonal, which is what makes them a decision rather than a score. */
		.lo   { fill: rgba(198,167,255,.05); stroke: #c6a7ff; stroke-width: 1; opacity: .55; }
		.mid  { fill: rgba(111,134,163,.07); stroke: #6f86a3; stroke-width: 1; opacity: .8; }
		.hi   { fill: rgba(117,210,253,.10); stroke: #75d2fd; stroke-width: 1; }
		.n-lo { fill: #c6a7ff; opacity: .75; }
		.n-mid{ fill: #9aa1b5; }
		.n-hi { fill: #75d2fd; }
	</style>

	<!-- severity 3 -->
	<rect class="mid" x="170" y="26"  width="150" height="68" rx="5" />
	<text class="n n-mid" x="245" y="66"  text-anchor="middle">3</text>
	<rect class="hi"  x="320" y="26"  width="150" height="68" rx="5" />
	<text class="n n-hi"  x="395" y="66"  text-anchor="middle">6</text>
	<rect class="hi"  x="470" y="26"  width="150" height="68" rx="5" />
	<text class="n n-hi"  x="545" y="66"  text-anchor="middle">9</text>

	<!-- severity 2 -->
	<rect class="lo"  x="170" y="94"  width="150" height="68" rx="5" />
	<text class="n n-lo"  x="245" y="134" text-anchor="middle">2</text>
	<rect class="mid" x="320" y="94"  width="150" height="68" rx="5" />
	<text class="n n-mid" x="395" y="134" text-anchor="middle">4</text>
	<rect class="hi"  x="470" y="94"  width="150" height="68" rx="5" />
	<text class="n n-hi"  x="545" y="134" text-anchor="middle">6</text>

	<!-- severity 1 -->
	<rect class="lo"  x="170" y="162" width="150" height="68" rx="5" />
	<text class="n n-lo"  x="245" y="202" text-anchor="middle">1</text>
	<rect class="lo"  x="320" y="162" width="150" height="68" rx="5" />
	<text class="n n-lo"  x="395" y="202" text-anchor="middle">2</text>
	<rect class="mid" x="470" y="162" width="150" height="68" rx="5" />
	<text class="n n-mid" x="545" y="202" text-anchor="middle">3</text>

	<!-- severity runs up the left edge -->
	<text class="tick" x="156" y="64"  text-anchor="end">3</text>
	<text class="tick" x="156" y="132" text-anchor="end">2</text>
	<text class="tick" x="156" y="200" text-anchor="end">1</text>
	<text class="ax" x="118" y="128" transform="rotate(-90 118 128)" text-anchor="middle">SEVERITY</text>
	<text class="ax" x="156" y="20"  text-anchor="end" opacity=".7">high</text>
	<text class="ax" x="156" y="244" text-anchor="end" opacity=".7">low</text>

	<!-- complexity runs along the bottom -->
	<text class="tick" x="245" y="252" text-anchor="middle">1</text>
	<text class="tick" x="395" y="252" text-anchor="middle">2</text>
	<text class="tick" x="545" y="252" text-anchor="middle">3</text>
	<text class="ax" x="395" y="280" text-anchor="middle">COGNITIVE COMPLEXITY</text>
	<text class="ax" x="170" y="280" text-anchor="start" opacity=".7">low</text>
	<text class="ax" x="620" y="280" text-anchor="end" opacity=".7">high</text>

	<!-- how much human understanding each band demands -->
	<rect class="lo"  x="150" y="311" width="14" height="10" rx="2" />
	<text class="lg" x="170" y="320">unsupervised agents</text>
	<rect class="mid" x="320" y="311" width="14" height="10" rx="2" />
	<text class="lg" x="340" y="320">supervised agents</text>
	<rect class="hi"  x="478" y="311" width="14" height="10" rx="2" />
	<text class="lg" x="498" y="320">hand-written</text>
</svg>
