name: GUI warnings

# React ships two runtimes, and only the development one checks anything: a
# style shorthand fighting a longhand, a missing key, invalid DOM nesting, a
# controlled input turning uncontrolled. It reports them through `console.error`
# — which is what `source/test/e2e-gui/fixtures.ts` already fails a test on, in
# 62 of the 65 spec files. So the browser suite has always been this project's
# net for them, without anybody writing a test for one.
#
# Since CC160K8 the shipped bundle is the production runtime, three times
# smaller and faster at every render. That is the right thing to ship and the
# right thing for the gate to run, and it compiles every one of those checks
# out. This is where the net went.
#
# On a GUI change reaching main, and not otherwise. Not on every push: the
# browser suite is CI's critical path already — three shards at about 3m30 — and
# a second full pass would roughly double the most expensive leg on every branch
# push, forever, for a class of bug this repository has been bitten by once. And
# not on a clock: this is one person's project, worked on some days and not
# others, so a nightly run bills for a machine on every day nobody touched the
# code and reports a Friday regression on a Tuesday.
#
# The change is the trigger, so the cost follows the risk. One run per merge
# that touched the GUI, against a flat history of rebase-merged commits — which
# means a red run names one commit rather than a day's worth.
#
# What this deliberately misses: a warning introduced from `source/lib`, which
# the GUI draws from but which changes on most commits. Watching it would fire
# nearly always and be worth nothing. `workflow_dispatch` covers the case where
# somebody knows they have done something interesting; otherwise the next GUI
# change catches it.
on:
  push:
    branches: [main]
    paths:
      - 'source/gui/**'
      # A React or renderer bump can introduce warnings with no source change
      # of ours at all.
      - 'package-lock.json'
      - '.github/workflows/gui-warnings.yml'
  workflow_dispatch:

jobs:
  gui-dev-bundle:
    name: GUI, development bundle
    runs-on: ubuntu-latest
    # Unsharded: one runner is cheaper than three, and nothing is
    # waiting on the answer.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The suite seeds each project by driving the real TUI, which runs git.
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - run: npm ci

      # Same cache the `gui` job fills on every push, so this run normally finds
      # the browsers already here.
      - name: Cache the browsers Playwright downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # EPIQ_GUI_DEV_BUILD=1 builds React's development runtime; the suite is
      # the same one the gate runs, and the script installs the browsers the way
      # `test:gui:ci` does. See `source/scripts/build-gui.mjs`.
      #
      # It sets IS_CI too, which is what caps Playwright at two workers and
      # allows one retry. Without it this job took the local default of six on a
      # four-vCPU runner and reported five tests failing that pass everywhere
      # else — the config says as much where it sets the number.
      - run: npm run test:gui:warnings

      - name: Keep the traces of whatever failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-dev-bundle-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
