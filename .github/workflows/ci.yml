name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - run: npm ci

      - run: npm run lint:err

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e:ci

  release:
    name: Release ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: epiq-macos-arm64
            bin: epiq
          - os: macos-13
            artifact: epiq-macos-x64
            bin: epiq
          - os: ubuntu-latest
            artifact: epiq-linux-x64
            bin: epiq
          - os: ubuntu-24.04-arm
            artifact: epiq-linux-arm64
            bin: epiq
          - os: windows-latest
            artifact: epiq-windows-x64.exe
            bin: epiq.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build:binary

      - name: Rename artifact
        run: mv dist/${{ matrix.bin }} dist/${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          fail_on_unmatched_files: true
