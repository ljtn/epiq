name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - run: npm ci

      - run: npm run lint:err

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e:ci

  # Its own job rather than more steps on `test`: it needs a browser and its
  # own build, shares no state with anything above, and a red GUI run should
  # say so by name instead of hiding behind a job called Test. Running beside
  # `test` also keeps the wall clock roughly where it was.
  gui:
    name: GUI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The suite seeds each project by driving the real TUI, which runs git.
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - run: npm ci

      - run: npm run test:gui:ci

  # Its own job for the same reasons the GUI one is, plus a sharper one: until
  # now this suite ran nowhere but the local pre-push hook. That made a failure
  # invisible on every pull request and turned it into a block on whoever
  # pushed next — `V8TZ5CD` sat broken on main exactly that way, and the person
  # who found it was the person it stopped.
  #
  # This is the suite that says whether several epiq processes on one board
  # still converge. Nothing else covers it: the unit suite never syncs, and the
  # e2e suite drives one actor.
  collaboration:
    name: Collaboration
    runs-on: ubuntu-latest
    # Individual tests allow up to fifteen minutes each, deliberately — they
    # race real syncs and a slow one is not a failed one. This is a bound on a
    # job that has stopped making progress, not a target.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Every actor is a real epiq process, and every one of them runs git.
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - run: npm ci

      # `test:collab` wraps this in the e2e docker image, which exists to give a
      # developer's machine the disposable, read-only checkout a hosted runner
      # already is. Same reason `test:e2e:ci` runs bare here.
      #
      # No build step: actors are spawned through the checkout's own `tsx`
      # against the TypeScript sources, so `npm ci` is the whole preparation.
      - run: npm run test:collab:ci

  release:
    name: Release ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gui]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: epiq-macos-arm64
            bin: epiq
          - os: ubuntu-latest
            artifact: epiq-linux-x64
            bin: epiq
          - os: ubuntu-24.04-arm
            artifact: epiq-linux-arm64
            bin: epiq
          - os: windows-latest
            artifact: epiq-windows-x64.exe
            bin: epiq.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build:binary

      - name: Rename artifact
        run: mv dist/${{ matrix.bin }} dist/${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          fail_on_unmatched_files: true

  # macOS Intel (x64) is cross-built on the Apple-silicon runner rather than
  # on a macos-13 Intel runner, whose hosted pool is scarce and was the cause
  # of release jobs timing out for 24h while awaiting a runner. The SEA blob is
  # architecture-independent, so we inject it into an x64 Node binary.
  release-macos-x64:
    name: Release epiq-macos-x64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gui]
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Download matching x64 Node
        run: |
          NODE_VERSION="$(node -p 'process.version')"
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-x64.tar.gz" -o /tmp/node-x64.tar.gz
          mkdir -p /tmp/node-x64
          tar -xzf /tmp/node-x64.tar.gz -C /tmp/node-x64 --strip-components=1

      - name: Build x64 binary
        run: npm run build:binary
        env:
          EPIQ_SEA_NODE: /tmp/node-x64/bin/node

      - name: Verify architecture
        run: |
          file dist/epiq
          file dist/epiq | grep -q x86_64 || { echo "::error::built binary is not x86_64"; exit 1; }
          # Best-effort runtime smoke test via Rosetta (present on GitHub's
          # macOS Apple-silicon runners). The arch check above is the hard gate.
          if arch -x86_64 dist/epiq --version; then
            echo "Rosetta smoke test passed."
          else
            echo "::warning::Rosetta smoke test unavailable; relying on the arch check."
          fi

      - name: Rename artifact
        run: mv dist/epiq dist/epiq-macos-x64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/epiq-macos-x64
          fail_on_unmatched_files: true
