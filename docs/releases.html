<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Epiq — releases</title>

		<meta
			name="description"
			content="Epiq release notes: every version of the Git-backed issue tracker, with changelogs pulled straight from GitHub."
		/>

		<meta name="theme-color" content="#090a0f" />

		<meta property="og:title" content="Epiq — Releases" />
		<meta
			property="og:description"
			content="Release notes and changelogs for Epiq, the Git-backed issue tracker."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://ljtn.github.io/epiq/og-board.jpeg" />
		<meta property="og:image:alt" content="The Epiq board in the browser, a ticket's detail panel open beside the columns, with the time-travel timeline plotting board events above" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<link rel="icon" href="./favicon.ico" sizes="any" />
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<nav class="nav">
			<div class="wrap nav-inner">
				<a class="brand" href="./index.html" aria-label="Epiq home">
					<span
						><span class="accent">:</span>epiq</span
					>
				</a>
				<div class="links">
					<a class="cmd-link" href="./docs.html" aria-label="Documentation"
						><span class="accent">:</span>docs</a
					>
					<a class="cmd-link" href="./blog.html" aria-label="Blog"
						><span class="accent">:</span>blog</a
					>
					<a
						class="cmd-link active"
						href="./releases.html"
						aria-current="page"
						aria-label="Releases"
						><span class="accent">v</span><span class="nav-version">1.7.1</span></a
					>
					<a class="btn" href="https://github.com/ljtn/epiq" aria-label="Epiq on GitHub">
						<span>GitHub</span>
					</a>
				</div>
			</div>
		</nav>

		<main id="top">
			<header class="docs-head wrap">
				<div class="kicker">Releases</div>
				<h1>version history.</h1>
				<p class="lead">A never ending story.</p>
			</header>

			<div class="wrap rel-wrap">
				<div id="releases" class="rel-list" aria-live="polite">
					<p class="rel-status">Fetching releases from GitHub…</p>
				</div>
			</div>
		</main>

		<footer class="footer">
			<div class="wrap footer-inner">
				<div><code>:wq</code> and move on.</div>
			</div>
		</footer>

		<script src="./md.js"></script>
		<script>
			(function () {
				var KEY = "epiq_gh_releases";
				var TTL_MS = 10 * 60 * 1000;
				var API =
					"https://api.github.com/repos/ljtn/epiq/releases?per_page=100";
				var root = document.getElementById("releases");

				function esc(s) {
					return s
						.replace(/&/g, "&amp;")
						.replace(/</g, "&lt;")
						.replace(/>/g, "&gt;")
						.replace(/"/g, "&quot;");
				}

				function fmtDate(iso) {
					var d = new Date(iso);
					if (isNaN(d)) return "";
					return d.toLocaleDateString("en-US", {
						year: "numeric",
						month: "short",
						day: "numeric",
						timeZone: "UTC",
					});
				}

				function render(releases) {
					var visible = releases.filter(function (r) {
						return !r.draft;
					});
					if (!visible.length) {
						renderError("No releases found.");
						return;
					}

					var latestId = null;
					for (var i = 0; i < visible.length; i++) {
						if (!visible[i].prerelease) {
							latestId = visible[i].id;
							break;
						}
					}

					var html = visible
						.map(function (r) {
							var name = r.name && r.name !== r.tag_name ? r.name : "";
							var badges = "";
							if (r.id === latestId)
								badges += '<span class="rel-badge">latest</span>';
							if (r.prerelease)
								badges += '<span class="rel-badge pre">pre-release</span>';

							return (
								'<article class="release">' +
								'<div class="rel-meta">' +
								'<a class="rel-tag" href="' +
								esc(r.html_url) +
								'" rel="noopener">' +
								esc(r.tag_name) +
								"</a>" +
								badges +
								'<time class="rel-date" datetime="' +
								esc(r.published_at || "") +
								'">' +
								fmtDate(r.published_at) +
								"</time>" +
								"</div>" +
								'<div class="rel-body">' +
								(name ? "<h3>" + esc(name) + "</h3>" : "") +
								(r.body
									? epiqMd.render(r.body, { heading: 3 })
									: '<p class="rel-empty">No release notes.</p>') +
								'<a class="rel-gh" href="' +
								esc(r.html_url) +
								'" rel="noopener">View on GitHub →</a>' +
								"</div>" +
								"</article>"
							);
						})
						.join("");

					root.innerHTML = html;
				}

				function renderError(msg) {
					root.innerHTML =
						'<p class="rel-status">' +
						esc(msg) +
						' Browse them on <a class="inline-link" href="https://github.com/ljtn/epiq/releases" rel="noopener">GitHub</a>.</p>';
				}

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && Array.isArray(obj.releases) ? obj : null;
					} catch (e) {
						return null;
					}
				}

				// Show any cached copy instantly; refresh in the background
				// unless it is still fresh.
				var cache = readCache();
				if (cache) render(cache.releases);
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch(API, { headers: { Accept: "application/vnd.github+json" } })
					.then(function (res) {
						return res.ok ? res.json() : Promise.reject(res.status);
					})
					.then(function (data) {
						var slim = data.map(function (r) {
							return {
								id: r.id,
								tag_name: r.tag_name,
								name: r.name,
								body: r.body,
								html_url: r.html_url,
								published_at: r.published_at,
								prerelease: r.prerelease,
								draft: r.draft,
							};
						});
						render(slim);
						try {
							localStorage.setItem(
								KEY,
								JSON.stringify({ releases: slim, ts: Date.now() })
							);
						} catch (e) {}
					})
					.catch(function () {
						if (!cache) renderError("Couldn’t load releases right now.");
					});
			})();
		</script>

		<script>
			(function () {
				var KEY = "epiq_version";
				var TTL_MS = 10 * 60 * 1000;
				// The same file the pre-push stamp reads, served by the raw CDN so it
				// costs nothing against the GitHub API rate limit.
				var SRC =
					"https://raw.githubusercontent.com/ljtn/epiq/main/source/version.ts";
				var outs = document.querySelectorAll(".nav-version");
				if (!outs.length) return;

				function render(version) {
					outs.forEach(function (out) {
						out.textContent = version;
					});
				}

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && typeof obj.version === "string" ? obj : null;
					} catch (e) {
						return null;
					}
				}

				// Show any cached version instantly; the markup carries the stamped
				// version as a fallback so the nav never renders empty.
				var cache = readCache();
				if (cache) render(cache.version);
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch(SRC)
					.then(function (res) {
						return res.ok ? res.text() : null;
					})
					.then(function (text) {
						var found = text && /EPIQ_VERSION\s*=\s*['"]([^'"]+)['"]/.exec(text);
						if (!found) return;
						render(found[1]);
						try {
							localStorage.setItem(
								KEY,
								JSON.stringify({ version: found[1], ts: Date.now() })
							);
						} catch (e) {}
					})
					.catch(function () {});
			})();
		</script>
		<script src="./analytics.js"></script>
	</body>
</html>
