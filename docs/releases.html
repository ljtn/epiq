		<main id="top">
			<header class="docs-head wrap">
				<div class="kicker">Releases</div>
				<h1>version history.</h1>
				<p class="lead">A never ending story.</p>
			</header>

			<div class="wrap rel-wrap">

			</div>
		</footer>

		<script src="./md.js"></script>
		<script>
			(function () {
				var KEY = "epiq_gh_releases";
				var TTL_MS = 10 * 60 * 1000;
				var API =
					"https://api.github.com/repos/ljtn/epiq/releases?per_page=100";
				var root = document.getElementById("releases");

				function esc(s) {
					return s
						.replace(/&/g, "&amp;")
						.replace(/</g, "&lt;")
						.replace(/>/g, "&gt;")
						.replace(/"/g, "&quot;");
				}

				function fmtDate(iso) {
					var d = new Date(iso);
					if (isNaN(d)) return "";
					return d.toLocaleDateString("en-US", {
						year: "numeric",
						month: "short",
						day: "numeric",
						timeZone: "UTC",
					});
				}

				function render(releases) {
					var visible = releases.filter(function (r) {
						return !r.draft;
					});
					if (!visible.length) {
						renderError("No releases found.");
						return;
					}

					var latestId = null;
					for (var i = 0; i < visible.length; i++) {
						if (!visible[i].prerelease) {
							latestId = visible[i].id;
							break;
						}
					}

					var html = visible
						.map(function (r) {
							var name = r.name && r.name !== r.tag_name ? r.name : "";
							var badges = "";
							if (r.id === latestId)
								badges += '<span class="rel-badge">latest</span>';
							if (r.prerelease)
								badges += '<span class="rel-badge pre">pre-release</span>';

							return (
								'<article class="release">' +
								'<div class="rel-meta">' +
								'<a class="rel-tag" href="' +
								esc(r.html_url) +
								'" rel="noopener">' +
								esc(r.tag_name) +
								"</a>" +
								badges +
								'<time class="rel-date" datetime="' +
								esc(r.published_at || "") +
								'">' +
								fmtDate(r.published_at) +
								"</time>" +
								"</div>" +
								'<div class="rel-body">' +
								(name ? "<h3>" + esc(name) + "</h3>" : "") +
								(r.body
									? epiqMd.render(r.body, { heading: 3 })
									: '<p class="rel-empty">No release notes.</p>') +
								'<a class="rel-gh" href="' +
								esc(r.html_url) +
								'" rel="noopener">View on GitHub →</a>' +
								"</div>" +
								"</article>"
							);
						})
						.join("");

					root.innerHTML = html;
				}

				function renderError(msg) {
					root.innerHTML =
						'<p class="rel-status">' +
						esc(msg) +
						' Browse them on <a class="inline-link" href="https://github.com/ljtn/epiq/releases" rel="noopener">GitHub</a>.</p>';
				}

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && Array.isArray(obj.releases) ? obj : null;
					} catch (e) {
						return null;
					}
				}

				// Show any cached copy instantly; refresh in the background
				// unless it is still fresh.
				var cache = readCache();
				if (cache) render(cache.releases);
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch(API, { headers: { Accept: "application/vnd.github+json" } })
					.then(function (res) {
						return res.ok ? res.json() : Promise.reject(res.status);
					})
					.then(function (data) {
						var slim = data.map(function (r) {
							return {
								id: r.id,
								tag_name: r.tag_name,
								name: r.name,
								body: r.body,
								html_url: r.html_url,
								published_at: r.published_at,
								prerelease: r.prerelease,
								draft: r.draft,
							};
						});
						render(slim);
						try {
							localStorage.setItem(
								KEY,
								JSON.stringify({ releases: slim, ts: Date.now() })
							);
						} catch (e) {}
					})
					.catch(function () {
						if (!cache) renderError("Couldn’t load releases right now.");
					});
			})();
		</script>

		<script>
			(function () {
				var KEY = "epiq_version";
				var TTL_MS = 10 * 60 * 1000;
				// The same file the pre-push stamp reads, served by the raw CDN so it
				// costs nothing against the GitHub API rate limit.
				var SRC =
					"https://raw.githubusercontent.com/ljtn/epiq/main/source/version.ts";
				var outs = document.querySelectorAll(".nav-version");
				if (!outs.length) return;

				function render(version) {
					outs.forEach(function (out) {
						out.textContent = version;
					});
				}

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && typeof obj.version === "string" ? obj : null;
					} catch (e) {
						return null;
					}
				}

				// Show any cached version instantly; the markup carries the stamped
				// version as a fallback so the nav never renders empty.
				var cache = readCache();
				if (cache) render(cache.version);
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch(SRC)
					.then(function (res) {
						return res.ok ? res.text() : null;
					})
					.then(function (text) {
						var found = text && /EPIQ_VERSION\s*=\s*['"]([^'"]+)['"]/.exec(text);
						if (!found) return;
						render(found[1]);
						try {
							localStorage.setItem(
								KEY,
								JSON.stringify({ version: found[1], ts: Date.now() })
							);
						} catch (e) {}
					})
					.catch(function () {});
			})();
		</script>

		<script>
			(function () {
				var KEY = "epiq_gh_stars";
				var buttons = document.querySelectorAll(".github-stars");
				if (!buttons.length) return;

				function formatCount(n) {
					if (n < 1000) return String(n);
					var units = [
						{ v: 1e6, s: "m" },
						{ v: 1e3, s: "k" },
					];
					for (var i = 0; i < units.length; i++) {
						if (n >= units[i].v) {
							var x = n / units[i].v;
							// Truncate (like GitHub): one decimal under 100, whole above.
							var str =
								x < 100
									? (Math.floor(x * 10) / 10).toString()
									: Math.floor(x).toString();
							return str + units[i].s;
						}
					}
				}

				function render(count) {
					var label = formatCount(Number(count));
					buttons.forEach(function (btn) {
						var wrap = btn.querySelector(".stars");
						var out = btn.querySelector(".star-count");
						if (out) out.textContent = label;
						if (wrap) wrap.hidden = false;
					});
				}

				var TTL_MS = 10 * 60 * 1000;

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && typeof obj.count === "number" ? obj : null;
					} catch (e) {
						return null;
					}
				}

				// Show any cached value instantly to avoid layout shift.
				var cache = readCache();
				if (cache) render(cache.count);

				// Skip the network while the cache is still fresh (< 30 min).
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch("https://api.github.com/repos/ljtn/epiq", {
					headers: { Accept: "application/vnd.github+json" },
				})
					.then(function (res) {
						return res.ok ? res.json() : null;
					})
					.then(function (data) {
						if (data && typeof data.stargazers_count === "number") {
							render(data.stargazers_count);
							try {
								localStorage.setItem(
									KEY,
									JSON.stringify({
										count: data.stargazers_count,
										ts: Date.now(),
									})
								);
							} catch (e) {}
						}
					})
					.catch(function () {});
			})();
		</script>
		<script src="./analytics.js"></script>
	</body>
