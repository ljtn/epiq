		<script src="./md.js"></script>
		<script>
			(function () {
				var KEY = "epiq_devto_posts";
				var TTL_MS = 10 * 60 * 1000;
				var API = "https://dev.to/api/articles?username=ljtn&per_page=30";
				var PREVIEW_LINES = 12;
				// Cap detail fetches; older posts fall back to the description.
				var PREVIEW_POSTS = 10;
				var root = document.getElementById("posts");

				function esc(s) {
					return String(s)
						.replace(/&/g, "&amp;")
						.replace(/</g, "&lt;")
						.replace(/>/g, "&gt;")
						.replace(/"/g, "&quot;");
				}

				function fmtDate(iso) {
					var d = new Date(iso);
					if (isNaN(d)) return "";
					return d.toLocaleDateString("en-US", {
						year: "numeric",
						month: "short",
						day: "numeric",
						timeZone: "UTC",
					});
				}

				// Take the first content lines of the post's markdown, skipping
				// images and embeds; blank lines stay as paragraph breaks but
				// don't count against the budget.
				function excerpt(mdText, maxLines) {
					var lines = mdText.replace(/\r\n/g, "\n").split("\n");
					var out = [];
					var count = 0;
					for (var i = 0; i < lines.length && count < maxLines; i++) {
						var t = lines[i].trim();
						if (!t) {
							out.push("");
							continue;
						}
						if (/^!\[/.test(t) || /^\{%/.test(t)) continue;
						out.push(t);
						count++;
					}
					return out.join("\n");
				}

				function render(posts) {
					if (!posts.length) {
						renderError("No posts published yet.");
						return;
					}

					root.innerHTML = posts
						.map(function (p) {
							var meta = [fmtDate(p.published_at)];
							if (p.reading_time_minutes)
								meta.push(p.reading_time_minutes + " min read");
							meta.push("dev.to ↗");

							var tags = (p.tag_list || [])
								.map(function (t) {
									return '<span class="post-tag">#' + esc(t) + "</span>";
								})
								.join("");

							var body = p.preview
								? '<div class="post-preview">' +
								  epiqMd.render(p.preview, { heading: 4 }) +
								  "</div>"
								: "<p>" + esc(p.description || "") + "</p>";

							return (
								'<article class="post">' +
								'<div class="post-meta">' +
								esc(meta.join("  ·  ")) +
								"</div>" +
								'<h3><a href="' +
								esc(p.url) +
								'" rel="noopener">' +
								esc(p.title) +
								"</a></h3>" +
								body +
								(tags ? '<div class="post-tags">' + tags + "</div>" : "") +
								'<a class="post-more" href="' +
								esc(p.url) +
								'" rel="noopener">Continue reading on dev.to →</a>' +
								"</article>"
							);
						})
						.join("");
				}

				function renderError(msg) {
					root.innerHTML =
						'<p class="rel-status">' +
						esc(msg) +
						' Read them on <a class="inline-link" href="https://dev.to/ljtn" rel="noopener">dev.to</a>.</p>';
				}

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && Array.isArray(obj.posts) ? obj : null;
					} catch (e) {
						return null;
					}
				}

				// Show any cached copy instantly; refresh in the background
				// unless it is still fresh.
				var cache = readCache();
				if (cache) render(cache.posts);
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch(API, { headers: { Accept: "application/json" } })
					.then(function (res) {
						return res.ok ? res.json() : Promise.reject(res.status);
					})
					.then(function (data) {
						var slim = data.map(function (p) {
							return {
								id: p.id,
								title: p.title,
								description: p.description,
								url: p.url,
								published_at: p.published_at,
								reading_time_minutes: p.reading_time_minutes,
								tag_list: p.tag_list,
							};
						});

						// Pull each article's markdown for a longer preview.
						return Promise.all(
							slim.map(function (p, i) {
								if (i >= PREVIEW_POSTS) return p;
								return fetch("https://dev.to/api/articles/" + p.id, {
									headers: { Accept: "application/json" },
								})
									.then(function (res) {
										return res.ok ? res.json() : null;
									})
									.then(function (full) {
										if (full && typeof full.body_markdown === "string") {
											p.preview = excerpt(full.body_markdown, PREVIEW_LINES);
										}
										return p;
									})
									.catch(function () {
										return p;
									});
							})
						);
					})
					.then(function (slim) {
						render(slim);
						try {
							localStorage.setItem(
								KEY,
								JSON.stringify({ posts: slim, ts: Date.now() })
							);
						} catch (e) {}
					})
					.catch(function () {
						if (!cache) renderError("Couldn’t load posts right now.");
					});
			})();
		</script>

		<script>
			(function () {
				var KEY = "epiq_gh_version";
				var TTL_MS = 10 * 60 * 1000;
				var pills = document.querySelectorAll(".ver-pill");
				if (!pills.length) return;

				function render(tag) {
					var label = String(tag).replace(/^v/, "");
					pills.forEach(function (pill) {
						var out = pill.querySelector(".ver-num");
						if (out) out.textContent = label;
						pill.hidden = false;
					});
				}

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && typeof obj.tag === "string" ? obj : null;
					} catch (e) {
						return null;
					}
				}

				var cache = readCache();
				if (cache) render(cache.tag);
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch("https://api.github.com/repos/ljtn/epiq/releases/latest", {
					headers: { Accept: "application/vnd.github+json" },
				})
					.then(function (res) {
						return res.ok ? res.json() : null;
					})
					.then(function (data) {
						if (data && typeof data.tag_name === "string") {
							render(data.tag_name);
							try {
								localStorage.setItem(
									KEY,
									JSON.stringify({ tag: data.tag_name, ts: Date.now() })
								);
							} catch (e) {}
						}
					})
					.catch(function () {});
			})();
		</script>

		<script>
			(function () {
				var KEY = "epiq_gh_stars";
				var buttons = document.querySelectorAll(".github-stars");
				if (!buttons.length) return;

				function formatCount(n) {
					if (n < 1000) return String(n);
					var units = [
						{ v: 1e6, s: "m" },
						{ v: 1e3, s: "k" },
					];
					for (var i = 0; i < units.length; i++) {
						if (n >= units[i].v) {
							var x = n / units[i].v;
							// Truncate (like GitHub): one decimal under 100, whole above.
							var str =
								x < 100
									? (Math.floor(x * 10) / 10).toString()
									: Math.floor(x).toString();
							return str + units[i].s;
						}
					}
				}

				function render(count) {
					var label = formatCount(Number(count));
					buttons.forEach(function (btn) {
						var wrap = btn.querySelector(".stars");
						var out = btn.querySelector(".star-count");
						if (out) out.textContent = label;
						if (wrap) wrap.hidden = false;
					});
				}

				var TTL_MS = 10 * 60 * 1000;

				function readCache() {
					try {
						var obj = JSON.parse(localStorage.getItem(KEY));
						return obj && typeof obj.count === "number" ? obj : null;
					} catch (e) {
						return null;
					}
				}

				// Show any cached value instantly to avoid layout shift.
				var cache = readCache();
				if (cache) render(cache.count);

				// Skip the network while the cache is still fresh (< 30 min).
				if (cache && Date.now() - cache.ts < TTL_MS) return;

				fetch("https://api.github.com/repos/ljtn/epiq", {
					headers: { Accept: "application/vnd.github+json" },
				})
					.then(function (res) {
						return res.ok ? res.json() : null;
					})
					.then(function (data) {
						if (data && typeof data.stargazers_count === "number") {
							render(data.stargazers_count);
							try {
								localStorage.setItem(
									KEY,
									JSON.stringify({
										count: data.stargazers_count,
										ts: Date.now(),
									})
								);
							} catch (e) {}
						}
					})
					.catch(function () {});
			})();
		</script>
