<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="One repo runs through host and sandbox, carried between them by git; the gatekeeper on the host and the planner, implementer and reviewer agents in the sandbox all read and write it.">
	<style>
		.wall { fill: rgba(198,167,255,.04); stroke: #c6a7ff; stroke-width: 1; }
		.box  { fill: #14131d; stroke: #9aa1b5; stroke-width: 1; }
		.key  { fill: #14131d; stroke: #c6a7ff; stroke-width: 1.2; }
		.epiq { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.fill { fill: rgba(103,212,232,.10); }
		.full { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.ro   { stroke-dasharray: 4 4; }
		.ax   { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; fill: #6f86a3; }
		.lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9aa1b5; text-anchor: middle; dominant-baseline: central; }
		.c-f  { fill: #c6a7ff; }
		.c-e  { fill: #67d4e8; }
	</style>
	<defs>
		<marker id="tip-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#67d4e8" />
		</marker>
	</defs>

	<rect class="wall" x="20" y="20" width="220" height="170" rx="4" />
	<text class="ax" x="36" y="42">HOST</text>
	<rect class="wall" x="300" y="20" width="580" height="170" rx="4" />
	<text class="ax" x="316" y="42">SANDBOX</text>

	<rect class="fill" x="50" y="60" width="190" height="28" />
	<rect class="fill" x="300" y="60" width="550" height="28" />
	<path class="epiq" d="M240 60 H53 Q50 60 50 63 V85 Q50 88 53 88 H240" />
	<path class="epiq ro" d="M240 60 H300 M240 88 H300" />
	<path class="epiq" d="M300 60 H847 Q850 60 850 63 V85 Q850 88 847 88 H300" />
	<text class="lbl c-e" x="450" y="74">Repo</text>

	<path class="full" d="M130 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M410 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M590 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M770 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<rect class="key" x="50" y="130" width="160" height="36" rx="3" /><text class="lbl c-f" x="130" y="148">Gatekeeper</text>
	<rect class="box" x="330" y="130" width="160" height="36" rx="3" /><text class="lbl" x="410" y="148">Planner</text>
	<rect class="box" x="510" y="130" width="160" height="36" rx="3" /><text class="lbl" x="590" y="148">Implementer</text>
	<rect class="box" x="690" y="130" width="160" height="36" rx="3" /><text class="lbl" x="770" y="148">Reviewer</text>

	<path class="full" d="M358 220 H388" /><text class="ax" x="398" y="224">SHARED, READ / WRITE</text>
</svg>
