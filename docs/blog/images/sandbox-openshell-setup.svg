<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="The setup: a human-supervised gatekeeper and three OpenShell sandboxes share Epiq as the control plane, in a repo of its own; the code repo lives inside the sandbox and the host reads it read-only. OpenShell's proxy wraps the sandbox: everything leaving crosses it, and only there are secrets added.">
	<style>
		.wall { fill: rgba(198,167,255,.04); stroke: #c6a7ff; stroke-width: 1; }
		.box  { fill: #14131d; stroke: #9aa1b5; stroke-width: 1; }
		.key  { fill: #14131d; stroke: #c6a7ff; stroke-width: 1.2; }
		.epiq { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.fill { fill: rgba(103,212,232,.10); }
		.code { fill: rgba(111,134,163,.12); stroke: #6f86a3; stroke-width: 1; }
		.proxy { fill: rgba(255,200,120,.12); }
		.pedge { fill: none; stroke: #ffc878; stroke-width: 1.4; filter: url(#glow); }
		.c-p  { fill: #ffd9a0; }
		.bar  { fill: rgba(111,134,163,.12); stroke: #6f86a3; stroke-width: 1; }
		.full { fill: none; stroke: #67d4e8; stroke-width: 1.2; }
		.rest { fill: none; stroke: #6f86a3; stroke-width: 1; }
		.ro   { stroke-dasharray: 4 4; }
		.ax   { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; fill: #6f86a3; }
		.lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9aa1b5; text-anchor: middle; dominant-baseline: central; }
		.c-f  { fill: #c6a7ff; }
		.c-e  { fill: #67d4e8; }
	</style>
	<defs>
		<filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
		<marker id="tip-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#67d4e8" />
		</marker>
		<marker id="tip-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L8 4 L0 8 z" fill="#6f86a3" />
		</marker>
	</defs>

	<rect class="wall" x="20" y="20" width="220" height="280" rx="4" />
	<text class="ax" x="36" y="42">HOST</text>
	<path class="proxy" fill-rule="evenodd" d="M304 20 H876 Q880 20 880 24 V296 Q880 300 876 300 H304 Q300 300 300 296 V24 Q300 20 304 20 Z M318 38 V282 H862 V38 Z" />
	<rect class="wall" x="300" y="20" width="580" height="280" rx="4" fill="none" />
	<rect class="pedge" x="318" y="38" width="544" height="244" />
	<rect class="pedge" x="300.7" y="20.7" width="578.6" height="278.6" rx="4" />
	<text class="ax" fill="#ffd9a0" style="fill:#ffd9a0" x="316" y="32">OPENSHELL · PROXY ADDS SECRETS ON THE WAY OUT</text>

	<rect class="fill" x="50" y="60" width="190" height="28" />
	<rect class="fill" x="300" y="60" width="550" height="28" />
	<path class="epiq" d="M240 60 H53 Q50 60 50 63 V85 Q50 88 53 88 H240" />
	<path class="epiq ro" d="M240 60 H300 M240 88 H300" />
	<path class="epiq" d="M300 60 H847 Q850 60 850 63 V85 Q850 88 847 88 H300" />
	<text class="lbl c-e" x="450" y="74">Epiq · control plane</text>

	<path class="full" d="M130 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />

	<path class="full" d="M410 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M590 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />
	<path class="full" d="M770 90 V128" marker-start="url(#tip-e)" marker-end="url(#tip-e)" />

	<rect class="key" x="50" y="130" width="160" height="36" rx="3" /><text class="lbl c-f" x="130" y="148">Gatekeeper</text>
	<text class="ax" x="130" y="190" text-anchor="middle">HUMAN SUPERVISED</text>

	<rect class="box" x="330" y="130" width="160" height="36" rx="3" /><text class="lbl" x="410" y="148">Planner</text>
	<rect class="box" x="510" y="130" width="160" height="36" rx="3" /><text class="lbl" x="590" y="148">Implementer</text>
	<rect class="box" x="690" y="130" width="160" height="36" rx="3" /><text class="lbl" x="770" y="148">Reviewer</text>
	<path class="rest" d="M410 166 V200 M590 166 V200 M770 166 V200" />
	<rect class="code" x="330" y="200" width="520" height="28" rx="3" /><text class="lbl" x="590" y="214">Code repo</text>
	<path class="rest ro" d="M328 214 H262 V158 H212" marker-end="url(#tip-r)" />


	<path class="rest" d="M410 228 V328" marker-end="url(#tip-r)" />
	<path class="rest" d="M590 228 V328" marker-end="url(#tip-r)" />
	<path class="rest" d="M770 228 V328" marker-end="url(#tip-r)" />
	<rect class="bar" x="300" y="330" width="580" height="32" rx="3" /><text class="lbl" x="590" y="346">Git remotes · model API · package registry</text>
</svg>
